plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

version = minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

runs {
    configureEach {
        workingDirectory project.file('run')

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource sourceSets.main
    }

    client {
        arguments.add '--width'
        arguments.add '960'
        arguments.add '--height'
        arguments.add '540'
        arguments.add '--quickPlaySingleplayer'
        arguments.add 'Mundo nuevo'
    }

    server {
        arguments.add '--nogui'
    }

    clientData {
        workingDirectory project.file('run-data')

        arguments.addAll '--mod', mod_id,
                         '--client',
                         '--output', file('src/generated/resources/').getAbsolutePath(),
                         '--existing', file('src/main/resources/').getAbsolutePath()
    }

    serverData {
        workingDirectory project.file('run-data')

        arguments.addAll '--mod', mod_id,
                         '--server',
                         '--output', file('src/generated/resources/').getAbsolutePath(),
                         '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def absentCompats = [
    'compats/industrialforegoing',
    'compats/ftbunearthed',
    'compats/sophisticated',
    'jei/catalysts/IndustrialForegoingCatalysts.java',
    'jei/catalysts/UneartherCatalysts.java',
]

sourceSets.main.java {
    absentCompats.each { path ->
        exclude(path.endsWith('.java') ? "**/${path}" : "**/${path}/**")
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'com.hrznstudio'
        }
    }

    maven {
        name = 'Rover656'
        url = 'https://maven.rover656.dev/releases'
        content {
            includeGroup 'com.enderio'
        }
    }

    maven {
        name = 'Saps'
        url = 'https://maven.saps.dev/releases'
        content {
            includeGroup 'com.mrbysco.forcecraft'
        }
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'net.createmod.ponder'
            includeGroup 'net.createmod.catnip'
            includeGroup 'dev.engine-room.flywheel'
        }
    }

    maven {
        name = 'IThundxR'
        url = 'https://maven.ithundxr.dev/snapshots'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    fractalJarJar {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "maven.modrinth:fractal-lib:${fractal_version_id}"
    fractalJarJar("maven.modrinth:fractal-lib:${fractal_version_id}") { transitive = false }

    compileOnly "curse.maven:thaumaturge-${thaumaturge_project_id}:${thaumaturge_version_id}"
    runtimeOnly "curse.maven:thaumaturge-${thaumaturge_project_id}:${thaumaturge_version_id}"

    compileOnly "maven.modrinth:re-avaritia:${avaritia_version_id}"
    runtimeOnly "maven.modrinth:re-avaritia:${avaritia_version_id}"

    compileOnly "maven.modrinth:curios:${curios_version_id}"
    runtimeOnly "maven.modrinth:curios:${curios_version_id}"

    compileOnly "maven.modrinth:lithostitched:${lithostitched_version_id}"
    runtimeOnly "maven.modrinth:lithostitched:${lithostitched_version_id}"

    compileOnly("maven.modrinth:jade:${jade_version_id}") { transitive = false }
    runtimeOnly "curse.maven:jade-${jade_project_id}:${jade_curse_file_id}"

    // Oracle Index (in-game guidebook, the format Oritech uses for its manual)
    runtimeOnly "curse.maven:oracle-index-${oracleindex_project_id}:${oracleindex_version_id}"

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }



    compileOnly("maven.modrinth:oritech:${oritech_version_id}") { transitive = false }
    runtimeOnly("maven.modrinth:oritech:${oritech_version_id}") { transitive = false }

    compileOnly("com.enderio:enderio:${enderio_version}") { transitive = false }
    runtimeOnly("com.enderio:enderio:${enderio_version}") { transitive = false }

    compileOnly("com.mrbysco.forcecraft:ForceCraft-26.1.2:${forcecraft_version}") { transitive = false }
    runtimeOnly("com.mrbysco.forcecraft:ForceCraft-26.1.2:${forcecraft_version}") { transitive = false }

    implementation "curse.maven:void-miners-remastered-${voidminers_project_id}:${voidminers_version_id}"

    implementation "curse.maven:botania-revived-${botania_project_id}:${botania_version_id}"

    runtimeOnly "maven.modrinth:patchouli:${patchouli_version_id}"

    runtimeOnly "maven.modrinth:athena-ctm:${athena_version_id}"

    runtimeOnly "maven.modrinth:geckolib:${geckolib_version_id}"

    // create adapted (Create para 26.1.2; lleva Ponder, Catnip, Flywheel y Registrate embebidos)
    compileOnly "curse.maven:create-adapted-${create_project_id}:${create_version_id}"
    runtimeOnly "curse.maven:create-adapted-${create_project_id}:${create_version_id}"

    // Hephaestus Forge (smeltery) and Hephaestus Tools (tool materials), runtime test of the rift metals
    runtimeOnly "curse.maven:hephaestus-forge-${hephaestus_project_id}:${hephaestus_version_id}"
    runtimeOnly "curse.maven:hephaestus-tools-${hephaestustools_project_id}:${hephaestustools_version_id}"
    // Player Animation Library (required by Hephaestus Tools)
    runtimeOnly "curse.maven:player-animation-library-${playeranimlib_project_id}:${playeranimlib_version_id}"

    // registrate (solo para compilar; en ejecucion sale embebido en Create Adapted)
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }

    // flywheel (solo para compilar; en ejecucion sale embebido en Create Adapted)
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge:${flywheel_version}") { transitive = false }

    // catnip (solo para compilar; en ejecucion sale embebido en Create Adapted)
    compileOnly("net.createmod.catnip:catnip-neoforge:${catnip_version}+mc${minecraft_version}") { transitive = false }

    // ponder (solo para compilar; en ejecucion sale embebido en Create Adapted)
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_maven_version}+mc${minecraft_version}") { transitive = false }

    compileOnly "curse.maven:equivox-${equivox_project_id}:${equivox_version_id}"
    runtimeOnly "curse.maven:equivox-${equivox_project_id}:${equivox_version_id}"

    // farmers delight (26.1.2 community port)
    compileOnly "curse.maven:farmers-delight-26-neo-ver-${farmersdelight_project_id}:${farmersdelight_version_id}"
    runtimeOnly "curse.maven:farmers-delight-26-neo-ver-${farmersdelight_project_id}:${farmersdelight_version_id}"

    // solar generation (panels of the solar compat; the mod works without it)
    compileOnly "curse.maven:solar-generation-${solargeneration_project_id}:${solargeneration_version_id}"
    runtimeOnly "curse.maven:solar-generation-${solargeneration_project_id}:${solargeneration_version_id}"

    // Mekanism Version Locked (community build of Mekanism for 26.1.2, no Maven of its own)
    compileOnly "curse.maven:mekanism-version-locked-${mekanismlocked_project_id}:${mekanismlocked_version_id}"
    runtimeOnly "curse.maven:mekanism-version-locked-${mekanismlocked_project_id}:${mekanismlocked_version_id}"

    // edivadlib (library required by solar generation)
    compileOnly "curse.maven:edivadlib-${edivadlib_project_id}:${edivadlib_version_id}"
    runtimeOnly "curse.maven:edivadlib-${edivadlib_project_id}:${edivadlib_version_id}"

    // ftb essentials + ftb library + ftb teams + architectury (test only: /day and /night commands in the dev client)
    runtimeOnly "curse.maven:ftb-essentials-${ftbessentials_project_id}:${ftbessentials_version_id}"
    runtimeOnly "curse.maven:ftb-library-forge-${ftblibrary_project_id}:${ftblibrary_version_id}"
    runtimeOnly "curse.maven:ftb-teams-${ftbteams_project_id}:${ftbteams_version_id}"
    runtimeOnly "curse.maven:architectury-api-${architectury_project_id}:${architectury_version_id}"

}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version        : minecraft_version,
        minecraft_version_range  : minecraft_version_range,
        neo_version              : neo_version,
        loader_version           : loader_version,
        mod_id                   : mod_id,
        mod_name                 : mod_name,
        mod_named                : mod_named,
        mod_license              : mod_license,
        mod_version              : mod_version,
        mod_authors              : mod_authors,
        mod_description          : mod_description,
        mod_credits              : mod_credits,
        thaumaturge_version      : thaumaturge_version,
        avaritia_version         : avaritia_version,
        fractal_mod_version      : fractal_mod_version,
        jade_version             : jade_version,
        curios_version           : curios_version,
        lithostitched_version    : lithostitched_version,
        jei_version              : jei_version,
        ponder_version           : ponder_version,
        create_version           : create_version,
        oritech_version          : oritech_version,
        enderio_version          : enderio_version,
        forcecraft_version       : forcecraft_version,
        botania_version          : botania_version,
        voidminers_version       : voidminers_version,
        equivox_version          : equivox_version,
        farmersdelight_version   : farmersdelight_version,
        solargeneration_version  : solargeneration_version,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('fractalMetadata') {
    def out = layout.buildDirectory.file('fractal/jarjar/metadata.json')
    def fractalVersion = fractal_mod_version
    inputs.property('fractalVersion', fractalVersion)
    outputs.file(out)
    doLast {
        def target = out.get().asFile
        target.parentFile.mkdirs()
        def fractalEntry = "{\"identifier\":{\"group\":\"de.dafuqs\",\"artifact\":\"Fractal\"},\"version\":{\"range\":\"[${fractalVersion},)\",\"artifactVersion\":\"${fractalVersion}\"},\"path\":\"META-INF/jarjar/Fractal-${fractalVersion}.jar\",\"isObfuscated\":false}"
        target.text = "{\"jars\":[${fractalEntry}]}"
    }
}

tasks.named('jar', Jar).configure {
    dependsOn tasks.named('fractalMetadata')
    from(configurations.fractalJarJar) {
        into 'META-INF/jarjar'
        rename { "Fractal-${fractal_mod_version}.jar" }
    }
    from(layout.buildDirectory.file('fractal/jarjar/metadata.json')) {
        into 'META-INF/jarjar'
    }
    manifest {
        attributes([
            "Specification-Title"   : mod_name,
            "Specification-Vendor"  : mod_authors,
            "Specification-Version" : "1",
            "Implementation-Title"  : project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '20000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Maven Central (Central Portal) publication. Credentials and the signing key live in ~/.gradle/gradle.properties
// (mavenCentralUsername, mavenCentralPassword, signingInMemoryKey, signingInMemoryKeyId, signingInMemoryKeyPassword),
// never in this repository. Publish with ./gradlew publishToMavenCentral. JitPack keeps working through publishToMavenLocal.
mavenPublishing {
    publishToMavenCentral()
    if (project.hasProperty('signingInMemoryKey')) {
        signAllPublications()
    }
    coordinates('fun.nadiendev', mod_id, project.version.toString())
    // The plugin classes are looked up by name so the IDE does not mark them red (it cannot see plugin classes in the Groovy DSL)
    def javadocJar = Class.forName('com.vanniktech.maven.publish.JavadocJar$Empty').getDeclaredConstructor().newInstance()
    configure(Class.forName('com.vanniktech.maven.publish.JavaLibrary').getConstructors().find { it.parameterCount == 2 }.newInstance(javadocJar, true))
    pom {
        name = mod_named
        description = mod_description
        inceptionYear = '2026'
        url = 'https://github.com/NadienDevMC/Thaumaturge-Tech-Compats'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'nadiendev'
                name = 'NadienDev'
                url = 'https://github.com/NadienDevMC'
            }
            developer {
                id = 'joanfo360'
                name = 'joanfo360'
                url = 'https://github.com/joanfo360'
            }
        }
        scm {
            url = 'https://github.com/NadienDevMC/Thaumaturge-Tech-Compats'
            connection = 'scm:git:git://github.com/NadienDevMC/Thaumaturge-Tech-Compats.git'
            developerConnection = 'scm:git:ssh://git@github.com/NadienDevMC/Thaumaturge-Tech-Compats.git'
        }
    }
}
